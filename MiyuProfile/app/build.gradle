plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/**
 * Modul opsional: profil Miyu (nama, bio, level, centang biru, admin).
 *
 * Sengaja dibuat sebagai library terpisah supaya bisa dipasang ke source
 * Miyu/Metrolist upstream tanpa menyentuh kode playback, DB, atau sync.
 * Cara pakai singkat ada di README.md di folder ini.
 */
android {
    namespace 'app.miyu.profile'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // Versi mengikuti app utama (lihat unknown/META-INF/*.version di repo APK)
    implementation platform('androidx.compose:compose-bom:2026.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // getDataStore() milik app utama
    compileOnly project(':app')
    // untuk build modul tersendiri, buat stub getDataStore() — lihat README
}
